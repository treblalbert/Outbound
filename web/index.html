<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>OUTBOUND</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #14141a; overflow: hidden;
    font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    color: #d9c8bf;
  }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block; background: #14141a;
    image-rendering: pixelated; image-rendering: crisp-edges;
    outline: none; touch-action: none;
    max-width: 100%; max-height: 100%;
  }
  #boot {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: #14141a; z-index: 10; transition: opacity .4s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #title { font-size: 34px; letter-spacing: .34em; color: #fff7a0; text-indent: .34em; }
  #tag { font-size: 13px; color: #b0a9e4; }
  #barOuter { width: min(360px, 70vw); height: 10px; border: 1px solid #6c5671; background: #28282e; }
  #bar { height: 100%; width: 0%; background: #fff7a0; transition: width .2s ease; }
  #note { font-size: 12px; color: #6c5671; min-height: 1em; }
  #err { color: #f98284; font-size: 12px; max-width: 80vw; text-align: center; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>

<div id="boot">
  <div id="title">OUTBOUND</div>
  <div id="tag">Get out. Get loot. Get home before dark.</div>
  <div id="barOuter"><div id="bar"></div></div>
  <div id="note">Loading…</div>
  <div id="err"></div>
</div>

<script>
(function () {
  var canvas = document.getElementById('canvas');
  var boot = document.getElementById('boot');
  var bar = document.getElementById('bar');
  var note = document.getElementById('note');
  var err = document.getElementById('err');

  // The game renders at the canvas backing size and letterboxes itself, so match
  // the canvas to the window and let CSS keep the 16:9 box centred.
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    var scale = Math.min(w / 1280, h / 720);
    var cw = Math.max(640, Math.round(1280 * scale));
    var ch = Math.max(360, Math.round(720 * scale));
    canvas.width = cw;
    canvas.height = ch;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  // Keep the page from scrolling or scrubbing when the game uses arrows/space/tab.
  window.addEventListener('keydown', function (e) {
    if ([' ', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', '/'].indexOf(e.key) >= 0) {
      e.preventDefault();
    }
  }, {passive: false});
  canvas.addEventListener('click', function () { canvas.focus(); });

  var Module = {
    canvas: canvas,
    arguments: [],
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) {
      if (!t) return;
      var m = /([\d.]+)\s*\/\s*([\d.]+)/.exec(t);
      if (m) {
        var pct = Math.min(100, (parseFloat(m[1]) / parseFloat(m[2])) * 100);
        bar.style.width = pct.toFixed(0) + '%';
        note.textContent = 'Loading assets… ' + pct.toFixed(0) + '%';
      } else {
        note.textContent = t;
      }
    },
    onRuntimeInitialized: function () {
      bar.style.width = '100%';
      note.textContent = 'Click to play';
      setTimeout(function () {
        boot.classList.add('gone');
        canvas.focus();
      }, 250);
    },
    onAbort: function (what) {
      boot.classList.remove('gone');
      err.textContent = 'Failed to start: ' + what +
        '\n\nThis build needs WebGL 2. Try a recent Chrome, Edge or Firefox.';
      note.textContent = '';
    }
  };
  window.Module = Module;

  if (!document.createElement('canvas').getContext('webgl2')) {
    err.textContent = 'Your browser does not support WebGL 2, which this game needs.';
    note.textContent = '';
    return;
  }

  var s = document.createElement('script');
  s.src = 'outbound.js';
  s.onerror = function () { err.textContent = 'Could not load outbound.js'; };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
